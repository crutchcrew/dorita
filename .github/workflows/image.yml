name: Image

# Publishes ghcr.io/crutchcrew/dorita for amd64 and arm64: `edge` from main,
# and `<version>` + `latest` from a `v<version>` tag. The Home Assistant app
# pulls `<version>` (homeassistant/config.yaml), so tag every app release.
on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Tags
        id: tags
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
            app="$(python3 -c 'import yaml; print(yaml.safe_load(open("homeassistant/config.yaml"))["version"])')"
            [ "$version" = "$app" ] || { echo "tag $version != homeassistant/config.yaml $app"; exit 1; }
            echo "tags=$image:$version,$image:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$image:edge" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=dorita980 REST server and web UI for iRobot Roomba
            org.opencontainers.image.licenses=MIT
