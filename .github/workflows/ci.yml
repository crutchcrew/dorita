name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
      - run: bun run build

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Home Assistant app config
        run: |
          python3 - <<'PY'
          import json, yaml
          app = yaml.safe_load(open('homeassistant/config.yaml'))
          version = json.load(open('packages/rest980/package.json'))['version']
          assert app['version'] == version, f"homeassistant/config.yaml {app['version']} != rest980 {version}"
          assert set(app['options']) <= set(app['schema']), 'options missing from schema'
          assert app['ports']['3000/tcp'] is None, 'keep the port closed by default'
          assert '172.30.32.0/23' in app['options']['trustedNetworks']
          assert app['ingress_port'] == int(app['environment']['INTERNAL_PORT']) != 3000, 'ingress must use the internal port'
          print('app', app['slug'], app['version'], 'ok')
          PY
      - name: Build
        run: docker build --tag dorita:ci .
      # Home Assistant style: root-only options.json, ingress on the internal
      # port 8099, port 3000 published. The published port never trusts an
      # address, so the runner gets 403 (no basic auth) even from 172.30.32.0/23.
      - name: Entrypoint drops root; the published port trusts nobody
        run: |
          data="$(mktemp -d)"
          printf '%s' '{"blid":"b","password":"p","robotIP":"192.0.2.1","keepAlive":true,"trustedNetworks":["0.0.0.0/0","::/0"]}' > "$data/options.json"
          sudo chown root:root "$data/options.json" && sudo chmod 600 "$data/options.json"
          docker run -d --name ha -p 3000:3000 -p 8099:8099 -v "$data:/data:ro" \
            -e CONFIG_FILE=/data/options.json -e INTERNAL_PORT=8099 dorita:ci
          trap 'docker logs ha; docker rm -f ha >/dev/null' EXIT
          for i in $(seq 30); do code="$(curl -s -o /dev/null -w '%{http_code}' localhost:3000/ping || true)"; [ "$code" != 000 ] && break; sleep 1; done
          test "$code" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:3000/api/local/action/start)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8099/ping)" = 200
          test "$(docker exec ha sh -c 'stat -c %U /proc/1')" = node
      - name: Node runtime has the AES128-SHA256 cipher
        run: docker run --rm --user 1000:1000 --entrypoint node dorita:ci -e "require('node:assert').ok(require('node:crypto').getCiphers().length && require('node:tls').getCiphers().includes('aes128-sha256'))"
